{% include base_path %}

<!-- ===== SCROLL PROGRESS BAR ===== -->
<div id="scrollProgress" aria-hidden="true"></div>

<!-- ===== BACK TO TOP ===== -->
<button class="back-to-top" id="backToTop" aria-label="Back to top" title="Back to top">&#8679;</button>

<!-- ===== BIBTEX TOAST ===== -->
<div class="bibtex-toast" id="bibtexToast">BibTeX copied to clipboard!</div>

<style>
  /* ── Scroll progress bar ── */
  #scrollProgress {
    position: fixed;
    top: 0;
    left: 0;
    width: 0%;
    height: 3px;
    background: linear-gradient(90deg, #005E7A 0%, #00b4d8 100%);
    z-index: 99999;
    transition: width 0.08s linear;
    border-radius: 0 2px 2px 0;
    box-shadow: 0 0 8px rgba(0, 180, 216, 0.5);
    pointer-events: none;
  }

  /* ── Back to top ── */
  .back-to-top {
    position: fixed;
    bottom: 28px;
    right: 24px;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: #005E7A;
    color: #fff;
    border: none;
    font-size: 1.5rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 16px rgba(0, 94, 122, 0.35);
    opacity: 0;
    transform: translateY(12px);
    transition: opacity 0.28s ease, transform 0.28s ease, background 0.2s;
    pointer-events: none;
    z-index: 900;
    line-height: 1;
  }

  .back-to-top.is-visible {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }

  .back-to-top:hover { background: #00789b; }

  /* ── BibTeX button ── */
  .bibtex-btn {
    display: inline-block;
    margin-left: 6px;
    padding: 2px 10px;
    border: 1.5px solid #005E7A;
    border-radius: 999px;
    background: transparent;
    color: #005E7A;
    font-size: 0.75rem;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 0.3px;
    transition: background 0.18s, color 0.18s;
    vertical-align: middle;
    font-family: inherit;
  }

  .bibtex-btn:hover { background: #005E7A; color: #fff; }

  .bibtex-btn.copied {
    background: #2e7d32;
    border-color: #2e7d32;
    color: #fff;
  }

  .bibtex-toast {
    position: fixed;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%) translateY(10px);
    background: #1a1a2e;
    color: #fff;
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 0.85rem;
    font-weight: 600;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease, transform 0.25s ease;
    z-index: 9999;
    white-space: nowrap;
  }

  .bibtex-toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* ── Scroll reveal ── */
  .reveal {
    opacity: 0;
    transform: translateY(22px);
    transition: opacity 0.30s ease, transform 0.30s ease;
  }

  .reveal.is-visible { opacity: 1; transform: translateY(0); }
  .reveal--delay-1 { transition-delay: 0.04s; }
  .reveal--delay-2 { transition-delay: 0.08s; }
  .reveal--delay-3 { transition-delay: 0.12s; }
  .reveal--delay-4 { transition-delay: 0.12s; }
</style>

<script>
(function () {

  /* ── Scroll progress bar ── */
  var bar = document.getElementById('scrollProgress');
  if (bar) {
    function updateBar() {
      var scrollTop  = window.scrollY || document.documentElement.scrollTop;
      var docHeight  = document.documentElement.scrollHeight - document.documentElement.clientHeight;
      bar.style.width = (docHeight > 0 ? (scrollTop / docHeight) * 100 : 0) + '%';
    }
    window.addEventListener('scroll', updateBar, { passive: true });
    updateBar();
  }

  /* ── Back to top ── */
  var btn = document.getElementById('backToTop');
  if (btn) {
    window.addEventListener('scroll', function () {
      btn.classList.toggle('is-visible', window.scrollY > 320);
    }, { passive: true });
    btn.addEventListener('click', function () {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  }

  /* ── BibTeX copy ── */
  var toast      = document.getElementById('bibtexToast');
  var toastTimer;

  function showToast() {
    if (!toast) return;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toast.classList.remove('show'); }, 2200);
  }

  function buildBibtex(b) {
    var type     = b.getAttribute('data-type') || 'article';
    var title    = b.getAttribute('data-title') || '';
    var author   = b.getAttribute('data-author') || '';
    var venue    = b.getAttribute('data-venue') || '';
    var year     = b.getAttribute('data-year') || '';
    var doi      = b.getAttribute('data-doi') || '';
    var venueKey = type === 'inproceedings' ? 'booktitle' : 'journal';
    var lines = [
      '@' + type + '{Bhat' + year + ',',
      '  title     = {' + title + '},',
      '  author    = {' + author + '},',
      '  ' + venueKey + ' = {' + venue + '},',
      '  year      = {' + year + '}'
    ];
    if (doi) lines.push('  doi       = {' + doi + '}');
    lines.push('}');
    return lines.join('\n');
  }

  document.addEventListener('click', function (e) {
    var b = e.target.closest('.bibtex-btn');
    if (!b) return;
    var bib = buildBibtex(b);
    var reset = function () {
      setTimeout(function () {
        b.innerHTML = '&#10077; Cite';
        b.classList.remove('copied');
      }, 2200);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(bib).then(function () {
        b.textContent = '✓ Copied';
        b.classList.add('copied');
        showToast();
        reset();
      });
    } else {
      var ta = document.createElement('textarea');
      ta.value = bib;
      ta.style.cssText = 'position:fixed;opacity:0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      b.textContent = '✓ Copied';
      b.classList.add('copied');
      showToast();
      reset();
    }
  });

  /* ── Scroll reveal ── */
  var SELECTORS = [
    '.stats-bar__item',
    '.about-hover-card',
    '.news-item',
    '.publications-list .list__item',
    '.research-list .list__item',
    '.research-highlights-card',
    '.page__content > p',
    '.page__content > h2',
    '.page__content > h3'
  ];

  function initReveal() {
    var elements = document.querySelectorAll(SELECTORS.join(','));
    if (!elements.length) return;

    elements.forEach(function (el) { el.classList.add('reveal'); });

    var parents = new Set();
    elements.forEach(function (el) { parents.add(el.parentElement); });
    parents.forEach(function (parent) {
      var kids = parent.querySelectorAll('.reveal');
      kids.forEach(function (kid, i) {
        var d = Math.min(i, 4);
        if (d > 0) kid.classList.add('reveal--delay-' + d);
      });
    });

    if (!('IntersectionObserver' in window)) {
      elements.forEach(function (el) { el.classList.add('is-visible'); });
      return;
    }

    var obs = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) {
          entry.target.classList.add('is-visible');
          obs.unobserve(entry.target);
        }
      });
    }, { threshold: 0.12 });

    elements.forEach(function (el) { obs.observe(el); });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initReveal);
  } else {
    initReveal();
  }

})();
</script>
