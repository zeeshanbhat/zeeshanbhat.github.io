<!-- ===== SCROLL PROGRESS BAR ===== -->
<div id="scrollProgress" aria-hidden="true"></div>

<style>
  #scrollProgress {
    position: fixed;
    top: 0;
    left: 0;
    width: 0%;
    height: 3px;
    background: linear-gradient(90deg, #005E7A 0%, #00b4d8 100%);
    z-index: 9999;
    transition: width 0.1s linear;
    border-radius: 0 2px 2px 0;
    box-shadow: 0 0 8px rgba(0, 180, 216, 0.4);
  }
</style>

<script>
(function () {
  var bar = document.getElementById('scrollProgress');
  if (!bar) return;

  function updateBar() {
    var scrollTop  = window.scrollY || document.documentElement.scrollTop;
    var docHeight  = document.documentElement.scrollHeight - document.documentElement.clientHeight;
    var pct = docHeight > 0 ? (scrollTop / docHeight) * 100 : 0;
    bar.style.width = pct + '%';
  }

  window.addEventListener('scroll', updateBar, { passive: true });
  updateBar();
})();
</script>
<!-- ===== SCROLL REVEAL JS ===== -->
<script>
(function () {
  var SELECTORS = [
    '.stats-bar__item',
    '.about-hover-card',
    '.news-item',
    '.publications-list .list__item',
    '.research-list .list__item',
    '.research-highlights-card',
    '.page__content > p',
    '.page__content > h2',
    '.page__content > h3'
  ];

  function init() {
    var elements = document.querySelectorAll(SELECTORS.join(','));
    if (!elements.length) return;

    /* Group items that appear together (e.g. grid cards) so they stagger */
    elements.forEach(function (el) {
      el.classList.add('reveal');
    });

    /* Stagger siblings in the same parent */
    var parents = new Set();
    elements.forEach(function (el) { parents.add(el.parentElement); });
    parents.forEach(function (parent) {
      var kids = parent.querySelectorAll('.reveal');
      kids.forEach(function (kid, i) {
        var delay = Math.min(i, 4);
        if (delay > 0) kid.classList.add('reveal--delay-' + delay);
      });
    });

    if (!('IntersectionObserver' in window)) {
      /* Fallback: show everything immediately */
      elements.forEach(function (el) { el.classList.add('is-visible'); });
      return;
    }

    var obs = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) {
          entry.target.classList.add('is-visible');
          obs.unobserve(entry.target);
        }
      });
    }, { threshold: 0.12 });

    elements.forEach(function (el) { obs.observe(el); });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>

<!-- ===== BACK TO TOP ===== -->
<button class="back-to-top" id="backToTop" aria-label="Back to top" title="Back to top">
  &#8679;
</button>

<style>
  .back-to-top {
    position: fixed;
    bottom: 28px;
    right: 24px;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: #005E7A;
    color: #fff;
    border: none;
    font-size: 1.5rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 16px rgba(0,94,122,0.35);
    opacity: 0;
    transform: translateY(12px);
    transition: opacity 0.28s ease, transform 0.28s ease, background 0.2s;
    pointer-events: none;
    z-index: 900;
    line-height: 1;
  }

  .back-to-top.is-visible {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }

  .back-to-top:hover {
    background: #00789b;
  }
</style>

<script>
(function () {
  var btn = document.getElementById('backToTop');
  if (!btn) return;
  window.addEventListener('scroll', function () {
    btn.classList.toggle('is-visible', window.scrollY > 320);
  }, { passive: true });
  btn.addEventListener('click', function () {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
})();
</script>
